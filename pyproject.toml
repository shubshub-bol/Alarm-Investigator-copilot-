[project]
name = "alarm-investigation-copilot"
version = "0.1.0"
description = "Alarm Investigation and Procedure Guidance Copilot (MCP + RAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.24",
    "pypdf>=4.0",
    "google-genai>=1.30",
    "jsonschema>=4.20",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each component lives in its own folder (per the submission layout) but installs as a normal package.
packages = [
    "services/alarm-simulator/alarm_simulator",
    "connectors/alarm_api_client",
    "mcp-servers/alarm-management/alarm_mcp",
    "rag",
    "apps/backend/copilot",
]
exclude = ["rag/tests", "rag/index"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "mcp-servers", "rag/tests", "apps/backend/tests"]
pythonpath = ["mcp-servers/alarm-management/tests"]  # shared test helpers
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]          # fake tokens in tests
"**/seed/**" = ["S311"]                   # random is for synthetic data, not security

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["alarm_simulator", "alarm_api_client", "alarm_mcp", "mcp_test_helpers", "rag", "copilot"]
