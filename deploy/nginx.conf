# Serves the built GUI and forwards /api to the copilot backend, so the browser talks to one origin (no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Inherited by every location below, because none of them sets its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Docker's DNS. With the address in a variable, nginx looks it up again (at most every 10 s) instead of keeping
    # the one from startup, so a restarted backend container with a new IP is still reached.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://copilot-backend:8080;

    # The copilot API, including the live answer stream (Server-Sent Events).
    location /api/ {
        proxy_pass $backend;   # no path after the address: the request path is passed on unchanged
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;       # pass each progress event on as soon as it arrives
        proxy_cache off;
        proxy_read_timeout 300s;   # an investigation with a language model can take a while
        client_max_body_size 64k;  # questions are short
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: /c/{id} and other app addresses load index.html, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
